# Test configuration only — this project is a set of scripts, not a package.
#
# `pythonpath = ["src"]` is what lets the tests do `import features` the same
# way the pipeline modules import each other. The alternative — adding
# src/__init__.py and rewriting every import as `from src.config import ...` —
# would break `python src/run_all.py`, which is the documented way to run the
# project. This keeps one import style everywhere.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_data: needs data/processed/*.csv, i.e. the pipeline has been run",
]
